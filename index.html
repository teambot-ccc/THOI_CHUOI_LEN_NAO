<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THỔI CHUỖI LÊN NÀO - CAPTAIN BOY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Quicksand:wght@700&display=swap');
        body { font-family: 'Quicksand', sans-serif; background: #e0f2fe; min-height: 100vh; overflow-x: hidden; }
        .comic-border { border: 5px solid #000; box-shadow: 8px 8px 0px #000; border-radius: 30px; background: white; }
        .btn-comic { background: #ef4444; color: white; border: 3px solid #000; font-family: 'Bangers'; padding: 12px 20px; box-shadow: 0 5px 0 #000; border-radius: 20px; transition: 0.2s; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-comic:active { transform: translateY(4px); box-shadow: 0 1px 0 #000; }
        .btn-comic:disabled { background: #94a3b8; cursor: not-allowed; }
        
        /* Hiệu ứng Khóa màn hình xám */
        .broken-mode { filter: grayscale(1); pointer-events: none; opacity: 0.6; }
        
        /* Avatar Selection */
        .ava-box { border: 4px solid transparent; border-radius: 20px; cursor: pointer; transition: 0.3s; padding: 5px; background: #f8fafc; text-align: center; }
        .ava-box.selected { border-color: #3b82f6; background: #dbeafe; transform: scale(1.05); }

        #game-map { display: grid; grid-template-columns: repeat(auto-fill, minmax(55px, 1fr)); gap: 10px; padding: 20px; position: relative; }
        .map-tile { aspect-ratio: 1; border: 2px solid #000; border-radius: 12px; background: rgba(255,255,255,0.8); display: flex; align-items: center; justify-content: center; font-family: 'Bangers'; font-size: 1.2rem; }
        .map-tile.active { background: #fef08a; border-color: #f59e0b; }
        .map-tile.milestone { background: #fee2e2; border-color: #ef4444; color: #ef4444; }
        
        #player-pawn { 
            position: absolute; width: 55px; height: 55px; z-index: 100; 
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 3px solid #000; border-radius: 50%; background: white; object-fit: cover;
        }

        .farm-bg { background-image: url('nenuutu.jpg'); background-size: cover; border: 6px solid #4d2c19; min-height: 450px; position: relative; border-radius: 20px; }
        .badge-item { width: 40px; height: 40px; border-radius: 50%; border: 2px dashed #999; display: flex; align-items: center; justify-content: center; filter: grayscale(1); font-size: 18px; transition: 0.5s; background: #f1f5f9; }
        .badge-item.unlocked { border: 3px solid #000; background: #fff; filter: grayscale(0); box-shadow: 2px 2px 0 #000; transform: scale(1.1); }

        /* Pop-up Chúc mừng */
        #congrats-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 3000; align-items: center; justify-content: center; padding: 20px; }
        .congrats-content { background: white; border: 6px solid #000; border-radius: 40px; padding: 40px; text-align: center; max-width: 400px; width: 100%; transform: scale(0.5); opacity: 0; }
    </style>
</head>
<body>

    <audio id="sfx-win" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>
    <audio id="bgm" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

    <!-- POP-UP CHÚC MỪNG -->
    <div id="congrats-modal">
        <div class="congrats-content">
            <h2 class="text-5xl mb-4 text-yellow-500" style="font-family: 'Bangers'">TUYỆT VỜI!</h2>
            <div id="congrats-badge-icon" class="text-7xl mb-4">🥉</div>
            <p id="congrats-text" class="text-xl font-black uppercase mb-6 leading-tight"></p>
            <button onclick="closeCongrats()" class="btn-comic w-full text-2xl">TIẾP TỤC HÀNH TRÌNH</button>
        </div>
    </div>

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="login-screen" class="fixed inset-0 z-[2000] bg-sky-500 flex items-center justify-center p-4">
        <div class="comic-border p-8 max-w-md w-full text-center space-y-6">
            <h1 class="text-4xl text-blue-700" style="font-family: 'Bangers'">THỔI CHUỖI LÊN NÀO</h1>
            <p class="font-bold italic text-sm text-gray-700">Chọn Avatar duy nhất cho suốt hành trình!</p>
            <div class="grid grid-cols-3 gap-3">
                <div class="ava-box selected" onclick="pickAva(this, 'avatar1.jpg')">
                    <img src="avatar1.jpg" class="w-full h-16 object-contain mx-auto">
                    <p class="text-[10px] font-bold mt-1">Cừu Non</p>
                </div>
                <div class="ava-box" onclick="pickAva(this, 'avatar2.jpg')">
                    <img src="avatar2.jpg" class="w-full h-16 object-contain mx-auto">
                    <p class="text-[10px] font-bold mt-1">Cừu Cute</p>
                </div>
                <div class="ava-box flex flex-col items-center justify-center border-2 border-dashed border-gray-400" onclick="document.getElementById('uploadAva').click()">
                    <div id="pre-view" class="text-xs font-bold text-gray-500 py-3"><i class="fas fa-upload text-lg"></i><br>Ảnh riêng</div>
                    <input type="file" id="uploadAva" class="hidden" accept="image/*" onchange="handleUpload(this)">
                </div>
            </div>
            <input type="text" id="nick" class="w-full border-4 border-black p-3 rounded-xl text-center font-black uppercase text-lg" placeholder="TÊN THUYỀN VIÊN...">
            <button onclick="startGame()" class="btn-comic w-full text-2xl uppercase">Bắt đầu</button>
        </div>
    </div>

    <!-- UI CHÍNH -->
    <div id="main-ui" class="hidden max-w-6xl mx-auto p-4 space-y-6">
        <header class="flex flex-wrap justify-between items-center bg-white border-4 border-black p-4 rounded-3xl">
            <div class="flex items-center gap-4">
                <img id="user-ava-header" src="" class="w-16 h-16 rounded-full border-4 border-black bg-white object-cover">
                <div>
                    <p id="user-nick-header" class="text-2xl font-black text-blue-600 uppercase italic"></p>
                    <div class="flex gap-1 mt-1" id="badge-container">
                        <div class="badge-item" id="b10">🥉</div><div class="badge-item" id="b20">🥈</div><div class="badge-item" id="b30">🥇</div>
                        <div class="badge-item" id="b40">🎖️</div><div class="badge-item" id="b50">🚀</div><div class="badge-item" id="b60">👑</div>
                    </div>
                </div>
            </div>
            <div class="text-right">
                <p id="user-streak" class="text-4xl font-black text-red-500 italic" style="font-family: 'Bangers'">0 DAYS 🔥</p>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-8 space-y-6">
                <!-- THÔNG BÁO ĐỨT CHUỖI -->
                <div id="alert-broken" class="hidden comic-border bg-slate-700 text-white p-8 text-center space-y-4">
                    <i class="fas fa-ghost text-5xl animate-bounce"></i>
                    <h2 class="text-3xl font-black" style="font-family: 'Bangers'">BẠN ĐÃ BỊ ĐÓNG BĂNG!</h2>
                    <p class="font-bold">Nhấn khôi phục để rã băng và tiếp tục chuyến đi nhé!</p>
                    <button id="btnRestore" onclick="doAction('restore')" class="btn-comic bg-blue-500 mx-auto text-xl uppercase">Khôi phục ngay 🆘</button>
                </div>

                <!-- BẢN ĐỒ -->
                <div id="map-container" class="comic-border bg-white relative overflow-hidden">
                    <div id="game-map">
                        <img id="player-pawn" src="" alt="pawn">
                    </div>
                </div>

                <!-- GỬI BÁO DANH -->
                <div id="action-box" class="comic-border p-6 bg-yellow-50">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-3">
                            <label class="font-black text-xs">SỐ TIỀN DNT HÔM NAY:</label>
                            <input type="number" id="amt" placeholder="Ví dụ: 11603" class="w-full border-4 border-black p-3 rounded-xl font-bold bg-white outline-none">
                            
                            <!-- Tải Bill -->
                            <input type="file" id="bill" class="hidden" accept="image/*" onchange="updateFileName(this)">
                            <button type="button" onclick="document.getElementById('bill').click()" id="bill-btn" class="w-full border-3 border-dashed border-black p-3 rounded-xl font-black bg-white text-xs text-gray-700 hover:bg-gray-50 flex items-center justify-center gap-2">
                                <i class="fas fa-cloud-arrow-up text-base"></i> <span id="bill-text">TẢI BILL MINH CHỨNG</span>
                            </button>
                        </div>
                        <div class="flex items-end">
                            <button id="btnSubmit" onclick="doAction('submit')" class="btn-comic w-full h-[58px] text-xl">GỬI BÁO DANH 🔥</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- BXH -->
            <div class="lg:col-span-4">
                <div class="farm-bg comic-border p-4 relative">
                    <h3 class="text-center font-black text-white text-2xl mb-6 drop-shadow-[3px_3px_0px_#000]">ĐỒNG CỪU ƯU TÚ 🐑</h3>
                    <div id="farm-grid" class="grid grid-cols-2 gap-3"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const APP_URL = "https://script.google.com/macros/s/AKfycbzJJdlSHj_2X7n1vtbmGpx7hMWLbjViQO2sr3N0CBzr3hzT0SBHO5qeU4gxmoutM_zP7g/exec";
        let myNick = "";
        let myAva = "avatar1.jpg";
        let milestonesAchieved = JSON.parse(localStorage.getItem('achievements') || '[]');

        function pickAva(el, url) {
            document.querySelectorAll('.ava-box').forEach(x => x.classList.remove('selected'));
            el.classList.add('selected');
            myAva = url;
        }

        function handleUpload(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('pre-view').innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover rounded-lg">`;
                    myAva = e.target.result;
                    document.querySelectorAll('.ava-box').forEach(x => x.classList.remove('selected'));
                    input.parentElement.classList.add('selected');
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function updateFileName(input) {
            const txt = document.getElementById('bill-text');
            const btn = document.getElementById('bill-btn');
            if (input.files && input.files[0]) {
                txt.innerText = "ĐÃ CHỌN: " + input.files[0].name;
                btn.classList.add('bg-green-50', 'border-green-600');
            } else {
                txt.innerText = "TẢI BILL MINH CHỨNG";
                btn.classList.remove('bg-green-50', 'border-green-600');
            }
        }

        function startGame() {
            myNick = document.getElementById('nick').value.trim().toUpperCase();
            if(!myNick) return alert("Vui lòng nhập tên thuyền viên!");
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-ui').classList.remove('hidden');
            document.getElementById('user-nick-header').innerText = myNick;
            document.getElementById('user-ava-header').src = myAva;
            document.getElementById('player-pawn').src = myAva;
            document.getElementById('bgm').play().catch(()=>{});
            initMap();
            sync();
            setInterval(sync, 15000);
        }

        function initMap() {
            const map = document.getElementById('game-map');
            const ms = [10, 20, 30, 40, 50, 60];
            for (let i = 1; i <= 60; i++) {
                const tile = document.createElement('div');
                tile.id = `tile-${i}`;
                tile.className = "map-tile " + (ms.includes(i) ? "milestone" : "");
                tile.innerText = i;
                map.appendChild(tile);
            }
        }

        async function sync() {
            try {
                const res = await fetch(APP_URL);
                const data = await res.json();
                
                const grid = document.getElementById('farm-grid');
                grid.innerHTML = '';
                data.sort((a,b) => b.streak - a.streak).slice(0, 8).forEach(u => {
                    grid.innerHTML += `<div class="bg-white/90 border-2 border-black p-2 rounded-xl flex items-center gap-2 shadow-[2px_2px_0_#000]">
                        <img src="${u.avatar}" class="w-8 h-8 rounded-full border-2 border-black object-cover bg-white">
                        <p class="text-[9px] font-black truncate">${u.nickname}</p>
                    </div>`;
                });

                const me = data.find(u => u.nickname.toUpperCase() === myNick);
                if(me) updateUI(me);
            } catch(e) {}
        }

        function updateUI(me) {
            const streak = parseInt(me.streak);
            document.getElementById('user-streak').innerText = `${streak} DAYS 🔥`;
            
            if(me.isBroken) {
                document.getElementById('map-container').classList.add('broken-mode');
                document.getElementById('action-box').classList.add('broken-mode');
                document.getElementById('alert-broken').classList.remove('hidden');
            } else {
                document.getElementById('map-container').classList.remove('broken-mode');
                document.getElementById('action-box').classList.remove('broken-mode');
                document.getElementById('alert-broken').classList.add('hidden');
                
                if(me.avatar) {
                    myAva = me.avatar;
                    document.getElementById('user-ava-header').src = myAva;
                    document.getElementById('player-pawn').src = myAva;
                }
                
                movePawn(streak);
                checkMilestones(streak);
            }
        }

        function movePawn(step) {
            if (step <= 0) return;
            const target = document.getElementById(`tile-${Math.min(step, 60)}`);
            const pawn = document.getElementById('player-pawn');
            const mapRect = document.getElementById('game-map').getBoundingClientRect();
            const rect = target.getBoundingClientRect();
            
            pawn.style.left = `${rect.left - mapRect.left + (rect.width/2) - 27}px`;
            pawn.style.top = `${rect.top - mapRect.top + (rect.height/2) - 27}px`;
            for(let i=1; i<=60; i++) document.getElementById(`tile-${i}`).classList.toggle('active', i <= step);
        }

        function checkMilestones(streak) {
            const levels = { 10: "🥉", 20: "🥈", 30: "🥇", 40: "🎖️", 50: "🚀", 60: "👑" };
            Object.keys(levels).forEach(m => {
                if(streak >= m) {
                    document.getElementById(`b${m}`).classList.add('unlocked');
                    if(!milestonesAchieved.includes(m)) {
                        showCongrats(levels[m], `Chúc mừng thuyền viên ${myNick}! <br> Bạn đã mở khóa chuỗi ${m}!`);
                        milestonesAchieved.push(m);
                        localStorage.setItem('achievements', JSON.stringify(milestonesAchieved));
                    }
                }
            });
        }

        function showCongrats(icon, text) {
            const modal = document.getElementById('congrats-modal');
            document.getElementById('congrats-badge-icon').innerText = icon;
            document.getElementById('congrats-text').innerHTML = text;
            modal.style.display = 'flex';
            document.getElementById('sfx-win').play();
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            gsap.to(".congrats-content", { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.7)" });
        }

        function closeCongrats() {
            gsap.to(".congrats-content", { scale: 0.5, opacity: 0, duration: 0.3, onComplete: () => {
                document.getElementById('congrats-modal').style.display = 'none';
            }});
        }

        async function doAction(type) {
        const amt = document.getElementById('amt').value;
        const billFile = document.getElementById('bill').files[0];

        // Nếu báo danh thì bắt buộc có bill và tiền
        if(type === 'submit' && (!amt || !billFile)) {
            return alert("Vui lòng nhập số tiền và tải ảnh bill để Captain duyệt nhé!");
        }

        const btn = type === 'submit' ? document.getElementById('btnSubmit') : document.getElementById('btnRestore');
        const oldTxt = btn.innerText;
        btn.disabled = true; 
        btn.innerText = "ĐANG XỬ LÝ...";

        const sendData = async (base64Proof = "") => {
            try {
                const response = await fetch(APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        nickname: myNick,
                        amount: amt || 0,
                        proof: base64Proof,
                        avatar: myAva,
                        action: type
                    })
                });
                const res = await response.json();
                if(res.status === "success") {
                    alert(type === 'submit' ? "Gửi báo danh thành công! Đã cập nhật minh chứng mới." : "Khôi phục thành công!");
                    document.getElementById('amt').value = '';
                    document.getElementById('bill').value = '';
                    updateFileName({files: []});
                    await sync(); // Cập nhật lại giao diện
                } else {
                    alert("Lỗi máy chủ: " + res.msg);
                }
            } catch(e) {
                alert("Lỗi kết nối! Hãy kiểm tra mạng.");
            } finally {
                btn.disabled = false;
                btn.innerText = oldTxt;
            }
        };

        if (billFile) {
            const reader = new FileReader();
            reader.readAsDataURL(billFile);
            reader.onload = () => sendData(reader.result);
        } else {
            sendData(""); // Trường hợp Restore
        }
    }
</script>
