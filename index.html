<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captain Boy - Star Voyage Farm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Quicksand:wght@700&display=swap');
        
        body { font-family: 'Quicksand', sans-serif; background: #e0f2fe; min-height: 100vh; overflow-x: hidden; }
        .comic-border { border: 5px solid #000; box-shadow: 8px 8px 0px #000; border-radius: 30px; background: white; }
        .btn-comic { background: #ef4444; color: white; border: 3px solid #000; font-family: 'Bangers'; padding: 12px 20px; box-shadow: 0 5px 0 #000; border-radius: 20px; transition: 0.2s; cursor: pointer; }
        .btn-comic:active { transform: translateY(4px); box-shadow: 0 1px 0 #000; }
        
        /* TRANG TRẠI RANKING */
        .farm-bg {
            background-image: url('https://img.freepik.com/free-vector/farm-scene-with-green-field-trees_1308-54273.jpg');
            background-size: cover; background-position: center;
            border: 6px solid #4d2c19; position: relative; min-height: 450px;
        }
        .farm-overlay { background: rgba(255,255,255,0.2); backdrop-filter: blur(1px); position: absolute; inset: 0; border-radius: 20px; }

        /* MAP */
        #game-map { display: grid; grid-template-columns: repeat(auto-fill, minmax(55px, 1fr)); gap: 10px; position: relative; padding: 20px; }
        .map-tile { aspect-ratio: 1; border: 2px solid #000; border-radius: 12px; background: rgba(255,255,255,0.8); display: flex; align-items: center; justify-content: center; font-family: 'Bangers'; font-size: 1.2rem; }
        .map-tile.active { background: #fef08a; border-color: #f59e0b; }
        .map-tile.milestone { background: #fca5a5; border-color: #ef4444; }

        #player-pawn { 
            position: absolute; width: 55px; height: 55px; z-index: 100; 
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 3px solid #000; border-radius: 50%; background: white; object-fit: cover;
        }

        /* HUY HIỆU */
        .badge-item { width: 45px; height: 45px; border-radius: 50%; border: 2px dashed #999; display: flex; align-items: center; justify-content: center; filter: grayscale(1); transition: 0.5s; font-size: 20px;}
        .badge-item.unlocked { border: 3px solid #000; background: #fff; filter: grayscale(0); box-shadow: 3px 3px 0 #000; }

        /* AVATAR SELECTOR */
        .ava-box { border: 4px solid transparent; border-radius: 20px; cursor: pointer; transition: 0.3s; padding: 5px; background: #f8fafc; }
        .ava-box.selected { border-color: #3b82f6; background: #dbeafe; transform: scale(1.05); }
    </style>
</head>
<body>

    <!-- ÂM THANH: Nhạc Dạo (Intro) và Nhạc Nền (Main BGM) -->
    <audio id="intro-audio" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"></audio>
    <audio id="bgm" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
    <audio id="sfx-win" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="login-screen" class="fixed inset-0 z-[2000] bg-sky-500 flex items-center justify-center p-4">
        <div class="comic-border p-8 max-w-md w-full text-center space-y-6">
            <h1 class="text-4xl text-blue-700" style="font-family: 'Bangers'">STAR VOYAGE</h1>
            <p class="font-bold italic text-sm text-gray-700">Chọn Avatar Cừu độc quyền cho suốt hành trình!</p>
            
            <div class="grid grid-cols-3 gap-3">
                <!-- Mẫu cừu 1 -->
                <div class="ava-box selected" onclick="pickAva(this, 'https://api.dicebear.com/7.x/bottts/svg?seed=SheepBoy1')">
                    <img src="avatar1.jpg" class="w-full h-16 object-contain">
                    <p class="text-[10px] font-bold mt-1">Cừu Boss</p>
                </div>
                <!-- Mẫu cừu 2 -->
                <div class="ava-box" onclick="pickAva(this, 'https://api.dicebear.com/7.x/bottts/svg?seed=SheepGirl2')">
                    <img src="avatar2.jpg" class="w-full h-16 object-contain">
                    <p class="text-[10px] font-bold mt-1">Cừu Cute</p>
                </div>
                <!-- Tải lên -->
                <div class="ava-box flex flex-col items-center justify-center border-2 border-dashed border-gray-400" onclick="document.getElementById('uploadAva').click()">
                    <div id="pre-view" class="text-xs font-bold text-gray-500 py-3"><i class="fas fa-upload text-lg"></i><br>Ảnh riêng</div>
                    <input type="file" id="uploadAva" class="hidden" accept="image/*" onchange="handleUpload(this)">
                </div>
            </div>

            <input type="text" id="nick" class="w-full border-4 border-black p-3 rounded-xl text-center font-black uppercase text-lg outline-none focus:bg-yellow-50" placeholder="TÊN THUYỀN VIÊN...">
            <button onclick="startGame()" class="btn-comic w-full text-2xl">BẮT ĐẦU HÀNH TRÌNH!</button>
        </div>
    </div>

    <!-- GIAO DIỆN CHÍNH -->
    <div id="main-ui" class="hidden max-w-6xl mx-auto p-4 space-y-6">
        <header class="flex flex-wrap justify-between items-center bg-white border-4 border-black p-4 rounded-3xl">
            <div class="flex items-center gap-4">
                <img id="user-ava-header" src="" class="w-16 h-16 rounded-full border-4 border-black bg-white object-cover shadow-[3px_3px_0_#000]">
                <div>
                    <p id="user-nick-header" class="text-2xl font-black text-blue-600 uppercase italic"></p>
                    <div class="flex gap-2 mt-1" id="badge-container">
                        <div class="badge-item" id="b10" title="Mốc 10">🥉</div>
                        <div class="badge-item" id="b20" title="Mốc 20">🥈</div>
                        <div class="badge-item" id="b30" title="Mốc 30">🥇</div>
                        <div class="badge-item" id="b40" title="Mốc 40">🎖️</div>
                        <div class="badge-item" id="b50" title="Mốc 50">🚀</div>
                        <div class="badge-item" id="b60" title="Mốc 60">👑</div>
                    </div>
                </div>
            </div>
            <div class="text-right flex items-center gap-4">
                <div>
                    <p class="text-[10px] font-black text-gray-400">CHẶNG ĐƯỜNG</p>
                    <p id="user-streak" class="text-3xl font-black text-red-500 italic" style="font-family: 'Bangers'">0 DAYS 🔥</p>
                </div>
                <!-- Nút Nhạc chỉ hiển thị Icon Loa -->
                <button onclick="toggleMusic()" id="music-btn" class="w-12 h-12 bg-yellow-300 border-3 border-black rounded-full flex items-center justify-center text-xl shadow-[3px_3px_0_#000] active:translate-y-1">
                    <i class="fas fa-volume-high" id="music-icon"></i>
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- PHẦN CHƠI CHÍNH -->
            <div class="lg:col-span-8 space-y-6">
                <!-- BẢN ĐỒ -->
                <div class="comic-border bg-white/60 relative overflow-hidden">
                    <div id="game-map">
                        <img id="player-pawn" src="" alt="pawn">
                    </div>
                </div>

                <!-- FORM HÀNH ĐỘNG -->
                <div id="action-box" class="comic-border p-6 bg-yellow-50">
                    <div id="alert-streak" class="hidden animate-bounce bg-red-600 text-white p-4 rounded-2xl border-4 border-black mb-4 font-black flex items-center gap-3">
                        <i class="fas fa-skull-crossbones text-2xl"></i>
                        ĐỨT CHUỖI RỒI! HÃY ẤN KHÔI PHỤC ĐỂ TIẾP TỤC!
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-3">
                            <label class="font-black text-xs text-gray-600">SỐ TIỀN DNT HÔM NAY:</label>
                            <input type="number" id="amt" placeholder="Ví dụ: 11.603" class="w-full border-4 border-black p-3 rounded-xl font-bold bg-white">
                            
                            <!-- Nút tải bill có hiệu ứng đổi trạng thái -->
                            <input type="file" id="bill" class="hidden" accept="image/*" onchange="updateFileName(this)">
                            <button type="button" onclick="document.getElementById('bill').click()" id="bill-btn" class="w-full border-3 border-dashed border-black p-3 rounded-xl font-black bg-white text-xs text-gray-700 hover:bg-gray-50 flex items-center justify-center gap-2">
                                <i class="fas fa-cloud-arrow-up text-base"></i> <span id="bill-text">TẢI BILL MINH CHỨNG</span>
                            </button>
                        </div>
                        <div class="flex flex-col justify-end gap-3">
                            <button id="btnSubmit" onclick="doAction('submit')" class="btn-comic h-[52px] text-xl">GỬI BÁO DANH 🔥</button>
                            <button id="btnRestore" onclick="doAction('restore')" class="btn-comic bg-blue-500 h-[52px] text-xl hidden">KHÔI PHỤC CHUỖI 🆘</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- TRANG TRẠI RANKING -->
            <div class="lg:col-span-4">
                <div class="farm-bg comic-border p-4 relative">
                    <div class="farm-overlay"></div>
                    <h3 class="relative text-center font-black text-white text-2xl mb-6 drop-shadow-[3px_3px_0px_#000]">ĐỒNG CỪU ƯU TÚ 🐑</h3>
                    <div id="farm-grid" class="relative grid grid-cols-2 gap-3">
                        <!-- Rank hiển thị ở đây -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const APP_URL = "https://script.google.com/macros/s/AKfycbxMBM4NbmFF0ME9tfY_MwnKygN8SDzLFSZulV0evuediIwH_6EmewYb1gnhgAlpW_8qcw/exec";

        let myNick = "";
        let myAva = "avatar1.jpg"; // Mặc định mẫu 1
        let myStreak = 0;
        let isMusicPlaying = false;

        // Phát nhạc dạo ngắn khi vào web (cho sinh động)
        window.addEventListener('click', () => {
            const intro = document.getElementById('intro-audio');
            if(intro.paused && !isMusicPlaying) {
                intro.volume = 0.3;
                intro.play().catch(()=>{});
            }
        }, { once: true });

        function pickAva(el, url) {
            document.querySelectorAll('.ava-box').forEach(x => x.classList.remove('selected'));
            el.classList.add('selected');
            myAva = url;
        }

        function handleUpload(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('pre-view').innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover rounded-lg">`;
                    myAva = e.target.result;
                    document.querySelectorAll('.ava-box').forEach(x => x.classList.remove('selected'));
                    input.parentElement.classList.add('selected');
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        // Đổi trạng thái nút khi đã chọn bill
        function updateFileName(input) {
            const btn = document.getElementById('bill-btn');
            const txt = document.getElementById('bill-text');
            if (input.files && input.files[0]) {
                txt.innerText = "ĐÃ CHỌN: " + input.files[0].name;
                btn.classList.add('bg-green-100', 'border-green-600', 'text-green-800');
            } else {
                txt.innerText = "TẢI BILL MINH CHỨNG";
                btn.classList.remove('bg-green-100', 'border-green-600', 'text-green-800');
            }
        }

        function startGame() {
            myNick = document.getElementById('nick').value.trim().toUpperCase();
            if(!myNick) return alert("Vui lòng nhập Tên Thuyền Viên!");
            
            // Dừng nhạc dạo, bật nhạc chính
            document.getElementById('intro-audio').pause();
            const bgm = document.getElementById('bgm');
            bgm.play().then(() => {
                isMusicPlaying = true;
                document.getElementById('music-icon').className = "fas fa-volume-high text-green-700";
            }).catch(()=>{});

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-ui').classList.remove('hidden');
            document.getElementById('user-nick-header').innerText = myNick;
            document.getElementById('user-ava-header').src = myAva;
            document.getElementById('player-pawn').src = myAva;
            
            initMap();
            sync();
            setInterval(sync, 15000);
        }

        function initMap() {
            const map = document.getElementById('game-map');
            const milestones = [10, 20, 30, 40, 50, 60];
            for (let i = 1; i <= 60; i++) {
                const tile = document.createElement('div');
                tile.id = `tile-${i}`;
                tile.className = "map-tile " + (milestones.includes(i) ? "milestone" : "");
                tile.innerText = i;
                map.appendChild(tile);
            }
        }

        async function sync() {
            try {
                const res = await fetch(APP_URL);
                const data = await res.json();
                
                const grid = document.getElementById('farm-grid');
                grid.innerHTML = '';
                data.sort((a,b) => b.streak - a.streak).slice(0, 8).forEach(u => {
                    grid.innerHTML += `
                        <div class="bg-white/90 border-2 border-black p-2 rounded-xl flex items-center gap-2 shadow-[3px_3px_0_#000]">
                            <img src="${u.avatar || 'https://api.dicebear.com/7.x/notionists/svg?seed=Sheep'}" class="w-8 h-8 rounded-full border-2 border-black object-cover bg-white">
                            <div class="overflow-hidden">
                                <p class="text-[9px] font-black truncate">${u.nickname}</p>
                                <p class="text-[10px] text-red-500 font-bold">${u.streak} 🔥</p>
                            </div>
                        </div>`;
                });

                const me = data.find(u => u.nickname.toUpperCase() === myNick);
                if(me) {
                    myStreak = parseInt(me.streak);
                    document.getElementById('user-streak').innerText = `${myStreak} DAYS 🔥`;
                    movePawn(myStreak);
                    checkBadges(myStreak);
                    checkTime(me);
                    
                    // Nếu trên server đã có lưu avatar cố định của người này, đồng bộ luôn
                    if(me.avatar && !myAva) {
                        myAva = me.avatar;
                        document.getElementById('user-ava-header').src = myAva;
                        document.getElementById('player-pawn').src = myAva;
                    }
                }
            } catch(e) {}
        }

        function checkTime(me) {
            if(!me.lastDate) return;
            const diff = (new Date() - new Date(me.lastDate)) / (1000 * 60 * 60 * 24);
            const isBroken = diff > 1.2 && me.status === "Approved";
            
            document.getElementById('alert-streak').classList.toggle('hidden', !isBroken);
            document.getElementById('btnRestore').classList.toggle('hidden', !isBroken);
            document.getElementById('btnSubmit').classList.toggle('hidden', isBroken);
        }

        function movePawn(step) {
            if (step <= 0) return;
            const target = document.getElementById(`tile-${step > 60 ? 60 : step}`);
            const pawn = document.getElementById('player-pawn');
            const mapRect = document.getElementById('game-map').getBoundingClientRect();
            const rect = target.getBoundingClientRect();
            
            pawn.style.left = `${rect.left - mapRect.left + (rect.width/2) - 27}px`;
            pawn.style.top = `${rect.top - mapRect.top + (rect.height/2) - 30}px`;
            
            for(let i=1; i<=60; i++) document.getElementById(`tile-${i}`).classList.toggle('active', i <= step);
        }

        function checkBadges(streak) {
            [10, 20, 30, 40, 50, 60].forEach(m => {
                if(streak >= m) {
                    const b = document.getElementById(`b${m}`);
                    if(!b.classList.contains('unlocked')) {
                        b.classList.add('unlocked');
                        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                        document.getElementById('sfx-win').play();
                    }
                }
            });
        }

        async function doAction(type) {
            const amt = document.getElementById('amt').value;
            const file = document.getElementById('bill').files[0];
            if(!file || !amt) return alert("Vui lòng nhập số tiền và chọn ảnh bill minh chứng!");

            const btn = type === 'submit' ? document.getElementById('btnSubmit') : document.getElementById('btnRestore');
            const oldText = btn.innerText;
            btn.disabled = true; btn.innerText = "ĐANG GỬI...";

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async () => {
                try {
                    await fetch(APP_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            nickname: myNick,
                            amount: amt,
                            proof: reader.result,
                            avatar: myAva, // Cố định Avatar này xuyên suốt game
                            action: type
                        })
                    });
                    alert("Đã gửi báo danh thành công! Chờ Captain duyệt nhé.");
                    // Reset form nhẹ
                    document.getElementById('amt').value = '';
                    document.getElementById('bill').value = '';
                    updateFileName({files: []});
                } catch(e) { alert("Lỗi kết nối máy chủ!"); }
                btn.disabled = false; btn.innerText = oldText;
            };
        }

        function toggleMusic() {
            const bgm = document.getElementById('bgm');
            const icon = document.getElementById('music-icon');
            if (bgm.paused) {
                bgm.play();
                icon.className = "fas fa-volume-high text-green-700";
            } else {
                bgm.pause();
                icon.className = "fas fa-volume-xmark text-red-600";
            }
        }
    </script>
</body>
</html>
