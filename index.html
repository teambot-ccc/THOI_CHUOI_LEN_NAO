<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAPTAIN BOY - THỔI CHUỖI LÊN NÀO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Quicksand:wght@700&display=swap');
        body { font-family: 'Quicksand', sans-serif; background: #e0f2fe; min-height: 100vh; overflow-x: hidden; }
        .comic-border { border: 5px solid #000; box-shadow: 8px 8px 0px #000; border-radius: 30px; background: white; }
        .btn-comic { background: #ef4444; color: white; border: 3px solid #000; font-family: 'Bangers'; padding: 12px 20px; box-shadow: 0 5px 0 #000; border-radius: 20px; transition: 0.2s; cursor: pointer; }
        .btn-comic:active { transform: translateY(4px); box-shadow: 0 1px 0 #000; }
        .streak-gray { filter: grayscale(1); opacity: 0.6; transition: 0.5s; }
        .farm-bg { background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://img.freepik.com/free-vector/farm-scene-with-green-field-trees_1308-54273.jpg'); background-size: cover; min-height: 400px; }
        #game-map { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; position: relative; padding: 20px; }
        .map-tile { aspect-ratio: 1; border: 2px solid #000; border-radius: 10px; background: rgba(255,255,255,0.8); display: flex; align-items: center; justify-content: center; font-family: 'Bangers'; font-size: 1rem; }
        .map-tile.active { background: #fef08a; border-color: #f59e0b; }
        #player-pawn { position: absolute; width: 50px; height: 50px; z-index: 100; transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); border: 3px solid #000; border-radius: 50%; background: white; object-fit: cover; pointer-events: none; }
        .ava-box.selected { border: 4px solid #ef4444; background: #fee2e2; }
    </style>
</head>
<body>

    <!-- VIDEO QUEST MODAL -->
    <div id="video-modal" class="fixed inset-0 z-[3000] bg-black/90 hidden flex items-center justify-center p-4">
        <div class="comic-border p-6 max-w-2xl w-full text-center space-y-4">
            <h2 class="text-3xl text-blue-600 font-black" style="font-family: 'Bangers'">QUEST: XEM VIDEO ĐỂ CỨU CHUỖI!</h2>
            <div class="aspect-video border-4 border-black rounded-xl overflow-hidden bg-black">
                <iframe id="yt-player" class="w-full h-full" src="https://www.youtube.com/embed/cwlToxaWuL8&list=RDcwlToxaWuL8&start_radio=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
            <div id="timer-box" class="text-2xl font-black text-red-500">30s</div>
            <button id="confirm-restore-btn" onclick="finishVideoQuest()" class="btn-comic w-full hidden bg-green-500">XÁC NHẬN KHÔI PHỤC ✅</button>
        </div>
    </div>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="fixed inset-0 z-[2000] bg-sky-500 flex items-center justify-center p-4">
        <div class="comic-border p-8 max-w-md w-full text-center space-y-6">
            <h1 class="text-4xl text-blue-700" style="font-family: 'Bangers'">THỔI CHUỖI LÊN NÀO</h1>
            <div class="grid grid-cols-3 gap-3" id="ava-picker">
                <div class="ava-box p-2 cursor-pointer rounded-xl border-2 border-black selected" onclick="pickAva(this, 'avatar1.jpg')"><img src="avatar1.jpg" class="w-full"></div>
                <div class="ava-box p-2 cursor-pointer rounded-xl border-2 border-black" onclick="pickAva(this, 'avatar2.jpg')"><img src="avatar2.jpg" class="w-full"></div>
                <div class="ava-box p-2 cursor-pointer rounded-xl border-2 border-dashed border-gray-400 flex items-center justify-center" onclick="document.getElementById('uploadAva').click()">
                    <span class="text-xs">Tải ảnh</span>
                    <input type="file" id="uploadAva" class="hidden" accept="image/*" onchange="handleUpload(this)">
                </div>
            </div>
            <input type="text" id="nick" class="w-full border-4 border-black p-3 rounded-xl text-center font-black" placeholder="TÊN THUYỀN VIÊN...">
            <button onclick="startGame()" class="btn-comic w-full text-2xl">VÀO TRANG TRẠI!</button>
        </div>
    </div>

    <!-- MAIN UI -->
    <div id="main-ui" class="hidden max-w-6xl mx-auto p-4 space-y-6">
        <header class="flex justify-between items-center bg-white border-4 border-black p-4 rounded-3xl">
            <div class="flex items-center gap-4">
                <img id="user-ava-header" src="" class="w-16 h-16 rounded-full border-4 border-black object-cover">
                <p id="user-nick-header" class="text-2xl font-black text-blue-600 uppercase"></p>
            </div>
            <div class="text-right">
                <p class="text-[10px] font-black text-gray-400">CHẶNG ĐƯỜNG</p>
                <p id="user-streak" class="text-3xl font-black text-red-500" style="font-family: 'Bangers'">0 DAYS 🔥</p>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-8 space-y-6">
                <div class="comic-border bg-white overflow-hidden relative">
                    <div id="game-map">
                        <img id="player-pawn" src="" alt="pawn">
                    </div>
                </div>
                
                <div id="action-box" class="comic-border p-6 bg-yellow-50">
                    <div id="alert-streak" class="hidden bg-red-600 text-white p-4 rounded-2xl border-4 border-black mb-4 font-black">
                        ⚠️ CHUỖI ĐÃ BỊ ĐỨT! HÃY KHÔI PHỤC NGAY.
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="number" id="amt" placeholder="Số tiền DNT..." class="border-4 border-black p-3 rounded-xl font-bold">
                        <button onclick="document.getElementById('bill').click()" class="bg-white border-2 border-dashed border-black p-3 rounded-xl text-sm font-bold">
                            <span id="bill-text">TẢI BILL MINH CHỨNG</span>
                            <input type="file" id="bill" class="hidden" accept="image/*" onchange="document.getElementById('bill-text').innerText='Đã chọn bill ✅'">
                        </button>
                        <button id="btnSubmit" onclick="doAction()" class="btn-comic md:col-span-2">GỬI BÁO DANH 🔥</button>
                        <button id="btnRestore" onclick="startVideoQuest()" class="btn-comic bg-blue-500 md:col-span-2 hidden">KHÔI PHỤC CHUỖI (XEM VIDEO) 🆘</button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-4">
                <div class="farm-bg comic-border p-4">
                    <h3 class="text-center font-black text-white text-xl mb-4">ĐỒNG CỪU ƯU TÚ 🐑</h3>
                    <div id="farm-grid" class="grid grid-cols-1 gap-2"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // THAY LINK WEB APP CỦA BẠN VÀO ĐÂY
        const APP_URL = "https://script.google.com/macros/s/AKfycbzSWQ5cHnFVFSWRpyZbY033NAKkTJGsvqm36RjhzNpnx_7yiTlICvVLw1yxpy0D1QwVPA/exec"; 
        
        let myNick = ""; 
        let myAva = "avatar1.jpg";

        function pickAva(el, url) {
            document.querySelectorAll('.ava-box').forEach(x => x.classList.remove('selected'));
            el.classList.add('selected');
            myAva = url;
        }

        function handleUpload(input) {
            if (input.files && input.files[0]) {
                let r = new FileReader();
                r.onload = (e) => { myAva = e.target.result; };
                r.readAsDataURL(input.files[0]);
            }
        }

        function startGame() {
            myNick = document.getElementById('nick').value.trim().toUpperCase();
            if(!myNick) return alert("Vui lòng nhập tên!");
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-ui').classList.remove('hidden');
            document.getElementById('user-nick-header').innerText = myNick;
            document.getElementById('user-ava-header').src = myAva;
            document.getElementById('player-pawn').src = myAva;
            initMap();
            sync();
        }

        function initMap() {
            let m = document.getElementById('game-map');
            for (let i=1; i<=60; i++) {
                let t = document.createElement('div');
                t.id = `tile-${i}`;
                t.className="map-tile";
                t.innerText=i;
                m.appendChild(t);
            }
        }

        async function sync() {
            try {
                const res = await fetch(APP_URL);
                const data = await res.json();
                
                const grid = document.getElementById('farm-grid');
                grid.innerHTML = '';
                
                data.sort((a,b) => b.streak - a.streak).forEach(u => {
                    grid.innerHTML += `
                        <div class="bg-white border-2 border-black p-2 rounded-xl flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <img src="${u.avatar}" class="w-8 h-8 rounded-full border border-black">
                                <span class="font-bold text-xs">${u.nickname}</span>
                            </div>
                            <span class="text-red-500 font-black">${u.streak} 🔥</span>
                        </div>`;
                });

                const me = data.find(u => u.nickname.toUpperCase() === myNick);
                if(me) {
                    document.getElementById('user-streak').innerText = `${me.streak} DAYS 🔥`;
                    movePawn(me.streak);
                    if(me.isBroken) {
                        document.getElementById('alert-streak').classList.remove('hidden');
                        document.getElementById('btnRestore').classList.remove('hidden');
                        document.getElementById('btnSubmit').classList.add('hidden');
                    }
                }
            } catch(e) { console.log("Chưa kết nối App URL"); }
        }

        function movePawn(step) {
            if (step <= 0) return;
            const target = document.getElementById(`tile-${step}`);
            if(!target) return;
            const pawn = document.getElementById('player-pawn');
            const mapRect = document.getElementById('game-map').getBoundingClientRect();
            const targetRect = target.getBoundingClientRect();
            
            pawn.style.left = `${targetRect.left - mapRect.left + (targetRect.width/2) - 25}px`;
            pawn.style.top = `${targetRect.top - mapRect.top + (targetRect.height/2) - 25}px`;
        }

        function startVideoQuest() {
            document.getElementById('video-modal').classList.remove('hidden');
            let time = 30;
            let count = setInterval(() => {
                time--;
                document.getElementById('timer-box').innerText = time + "s";
                if(time <= 0) {
                    clearInterval(count);
                    document.getElementById('confirm-restore-btn').classList.remove('hidden');
                }
            }, 1000);
        }

        async function finishVideoQuest() {
            await fetch(APP_URL, {
                method: 'POST',
                body: JSON.stringify({ nickname: myNick, action: "restore" })
            });
            alert("Đã khôi phục chuỗi! Hãy báo danh ngay.");
            location.reload();
        }

        async function doAction() {
            let amt = document.getElementById('amt').value;
            let file = document.getElementById('bill').files[0];
            if(!file || !amt) return alert("Thiếu tiền hoặc bill!");

            let reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async () => {
                await fetch(APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        nickname: myNick,
                        amount: amt,
                        avatar: myAva,
                        proof: reader.result,
                        action: "submit"
                    })
                });
                alert("Đã gửi! Chờ duyệt.");
                location.reload();
            };
        }
    </script>
</body>
</html>
