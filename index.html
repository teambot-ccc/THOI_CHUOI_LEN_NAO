<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THỔI CHUỖI LÊN NÀO - CAPTAIN BOY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Quicksand:wght@700&display=swap');
        body { font-family: 'Quicksand', sans-serif; background: #e0f2fe; min-height: 100vh; overflow-x: hidden; }
        .comic-border { border: 5px solid #000; box-shadow: 8px 8px 0px #000; border-radius: 30px; background: white; }
        .btn-comic { background: #ef4444; color: white; border: 3px solid #000; font-family: 'Bangers'; padding: 12px 20px; box-shadow: 0 5px 0 #000; border-radius: 20px; transition: 0.2s; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-comic:active { transform: translateY(4px); box-shadow: 0 1px 0 #000; }
        
        .broken-mode { filter: grayscale(1); pointer-events: none; opacity: 0.6; }
        
        #game-map { display: grid; grid-template-columns: repeat(auto-fill, minmax(55px, 1fr)); gap: 10px; padding: 20px; position: relative; }
        .map-tile { aspect-ratio: 1; border: 2px solid #000; border-radius: 12px; background: rgba(255,255,255,0.8); display: flex; align-items: center; justify-content: center; font-family: 'Bangers'; font-size: 1.2rem; color: #64748b; }
        .map-tile.active { background: #fef08a; border-color: #f59e0b; color: #b45309; }
        .map-tile.milestone { background: #fee2e2; border-color: #ef4444; color: #ef4444; }
        
        #player-pawn { 
            position: absolute; width: 55px; height: 55px; z-index: 100; 
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 3px solid #000; border-radius: 50%; background: white; object-fit: cover;
        }

        /* Widget Chuỗi Nhóm Cố định */
        .group-status { position: fixed; bottom: 20px; left: 20px; z-index: 1000; width: 250px; }
        
        /* Đồng cừu cuộn */
        .farm-bg { background: #7c2d12; border: 6px solid #4d2c19; height: 550px; border-radius: 25px; overflow: hidden; display: flex; flex-direction: column; }
        #farm-grid { overflow-y: auto; padding: 15px; flex-grow: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        #farm-grid::-webkit-scrollbar { width: 6px; }
        #farm-grid::-webkit-scrollbar-thumb { background: #4d2c19; border-radius: 10px; }

        .badge-item { width: 35px; height: 35px; border-radius: 50%; border: 2px dashed #999; display: flex; align-items: center; justify-content: center; filter: grayscale(1); font-size: 16px; background: #f1f5f9; }
        .badge-item.unlocked { border: 2px solid #000; background: #fff; filter: grayscale(0); box-shadow: 2px 2px 0 #000; transform: scale(1.1); }
    </style>
</head>
<body>

    <!-- WIDGET CHUỖI NHÓM -->
    <div id="group-widget" class="group-status hidden">
        <div class="comic-border p-4 bg-orange-400 border-black">
            <p class="text-[10px] font-black uppercase text-white mb-1 drop-shadow-md">Chuỗi Nhóm Hệ Cừu 🔥</p>
            <div id="group-streak-val" class="text-4xl font-black text-white italic mb-2" style="font-family: 'Bangers'">0 DAYS</div>
            <div class="bg-white/30 p-2 rounded-xl border-2 border-black">
                <p class="text-[9px] font-bold text-black mb-1 italic text-center">Đủ 30 cừu báo danh sẽ giữ chuỗi nhóm!</p>
                <div class="w-full h-3 bg-gray-200 border border-black rounded-full overflow-hidden">
                    <div id="group-bar" class="h-full bg-green-500 transition-all duration-700" style="width: 0%"></div>
                </div>
                <p id="group-count-val" class="text-[10px] font-black text-black text-right mt-1">0/30 Cừu</p>
            </div>
        </div>
    </div>

     <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="login-screen" class="fixed inset-0 z-[2000] bg-sky-500 flex items-center justify-center p-4">
        <div class="comic-border p-8 max-w-md w-full text-center space-y-6">
            <h1 class="text-4xl text-blue-700" style="font-family: 'Bangers'">THỔI CHUỖI LÊN NÀO</h1>
            <p class="font-bold italic text-sm text-gray-700">Chọn Avatar duy nhất cho suốt hành trình!</p>
            <div class="grid grid-cols-3 gap-3">
                <div class="ava-box selected" onclick="pickAva(this, 'avatar1.jpg')">
                    <img src="avatar1.jpg" class="w-full h-16 object-contain mx-auto">
                    <p class="text-[10px] font-bold mt-1">Cừu Non</p>
                </div>
                <div class="ava-box" onclick="pickAva(this, 'avatar2.jpg')">
                    <img src="avatar2.jpg" class="w-full h-16 object-contain mx-auto">
                    <p class="text-[10px] font-bold mt-1">Cừu Cute</p>
                </div>
                <div class="ava-box flex flex-col items-center justify-center border-2 border-dashed border-gray-400" onclick="document.getElementById('uploadAva').click()">
                    <div id="pre-view" class="text-xs font-bold text-gray-500 py-3"><i class="fas fa-upload text-lg"></i><br>Ảnh riêng</div>
                    <input type="file" id="uploadAva" class="hidden" accept="image/*" onchange="handleUpload(this)">
                </div>
            </div>
            <input type="text" id="nick" class="w-full border-4 border-black p-3 rounded-xl text-center font-black uppercase text-lg" placeholder="TÊN THUYỀN VIÊN...">
            <button onclick="startGame()" class="btn-comic w-full text-2xl uppercase">Bắt đầu</button>
        </div>
    </div>


    <!-- UI CHÍNH -->
    <div id="main-ui" class="hidden max-w-7xl mx-auto p-4 space-y-6">
        <header class="flex flex-wrap justify-between items-center bg-white border-4 border-black p-4 rounded-3xl">
            <div class="flex items-center gap-4">
                <img id="user-ava-header" src="" class="w-16 h-16 rounded-full border-4 border-black bg-white object-cover">
                <div>
                    <p id="user-nick-header" class="text-2xl font-black text-blue-600 uppercase italic"></p>
                    <div class="flex gap-1 mt-1" id="badge-container">
                        <div class="badge-item" id="b10">🥉</div><div class="badge-item" id="b20">🥈</div><div class="badge-item" id="b30">🥇</div>
                        <div class="badge-item" id="b40">🎖️</div><div class="badge-item" id="b50">🚀</div><div class="badge-item" id="b60">👑</div>
                    </div>
                </div>
            </div>
            <div class="text-right">
                <p id="user-streak" class="text-4xl font-black text-red-500 italic" style="font-family: 'Bangers'">0 DAYS 🔥</p>
                <p class="text-[10px] font-bold text-gray-500 uppercase">Chuỗi cá nhân</p>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 pb-20">
            <div class="lg:col-span-8 space-y-6">
                <div id="alert-broken" class="hidden comic-border bg-slate-700 text-white p-8 text-center space-y-4">
                    <h2 class="text-3xl font-black" style="font-family: 'Bangers'">BẠN ĐÃ BỊ ĐÓNG BĂNG!</h2>
                    <button onclick="doAction('restore')" class="btn-comic bg-blue-500 mx-auto">KHÔI PHỤC CHUỖI 🆘</button>
                </div>

                <div id="map-container" class="comic-border bg-white relative overflow-hidden min-h-[300px]">
                    <div id="game-map"></div>
                </div>

                <div id="action-box" class="comic-border p-6 bg-yellow-50">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-center items-end">
                        <div class="space-y-3">
                            <input type="number" id="amt" placeholder="SỐ TIỀN DNT HÔM NAY..." class="w-full border-4 border-black p-3 rounded-xl font-bold outline-none">
                            <input type="file" id="bill" class="hidden" accept="image/*" onchange="updateFileName(this)">
                            <button type="button" onclick="document.getElementById('bill').click()" id="bill-btn" class="w-full border-2 border-dashed border-black p-3 rounded-xl font-black text-xs bg-white uppercase">
                                <span id="bill-text">TẢI BILL MINH CHỨNG</span>
                            </button>
                        </div>
                        <button id="btnSubmit" onclick="doAction('submit')" class="btn-comic w-full h-[55px] text-xl uppercase">Gửi báo danh</button>
                    </div>
                </div>
            </div>

            <!-- ĐỒNG CỪU (HIỆN TẤT CẢ) -->
            <div class="lg:col-span-4">
                <div class="farm-bg comic-border relative">
                    <div class="p-4 bg-[#7c2d12] border-b-4 border-black">
                        <h3 class="text-center font-black text-white text-2xl uppercase italic" style="font-family: 'Bangers'">Đồng Cừu Ưu Tú 🐑</h3>
                    </div>
                    <div id="farm-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const APP_URL = "URL_CỦA_BẠN_Ở_ĐÂY"; 
        let myNick = "";
        let myAva = "avatar1.jpg";
        let milestonesAchieved = JSON.parse(localStorage.getItem('achievements') || '[]');

        function pickAva(el, url) {
            document.querySelectorAll('.ava-box').forEach(x => x.classList.remove('selected'));
            el.classList.add('selected');
            myAva = url;
        }

        function handleUpload(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('pre-view').innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover rounded-lg">`;
                    myAva = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function updateFileName(input) {
            if (input.files[0]) document.getElementById('bill-text').innerText = "ĐÃ CHỌN: " + input.files[0].name;
        }

        function startGame() {
            myNick = document.getElementById('nick').value.trim().toUpperCase();
            if(!myNick) return alert("Vui lòng nhập tên thuyền viên!");
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-ui').classList.remove('hidden');
            document.getElementById('group-widget').classList.remove('hidden');
            document.getElementById('user-nick-header').innerText = myNick;
            document.getElementById('user-ava-header').src = myAva;
            initMap();
            sync();
            setInterval(sync, 15000);
        }

        function initMap() {
            const map = document.getElementById('game-map');
            const ms = [10, 20, 30, 40, 50, 60];
            map.innerHTML = `<img id="player-pawn" src="${myAva}" alt="pawn">`;
            for (let i = 1; i <= 60; i++) {
                const tile = document.createElement('div');
                tile.id = `tile-${i}`;
                tile.className = "map-tile " + (ms.includes(i) ? "milestone" : "");
                tile.innerText = i;
                map.appendChild(tile);
            }
        }

        async function sync() {
            try {
                const res = await fetch(APP_URL);
                const data = await res.json();
                
                // Chuỗi nhóm
                document.getElementById('group-streak-val').innerText = `${data.groupStreak} DAYS`;
                document.getElementById('group-count-val').innerText = `${data.activeToday}/30 Cừu`;
                const percent = Math.min((data.activeToday / 30) * 100, 100);
                document.getElementById('group-bar').style.width = percent + '%';

                // Đồng cừu (Tất cả thành viên)
                const grid = document.getElementById('farm-grid');
                grid.innerHTML = '';
                data.users.sort((a,b) => b.streak - a.streak).forEach(u => {
                    grid.innerHTML += `
                        <div class="bg-white border-2 border-black p-2 rounded-xl flex items-center gap-2 shadow-[3px_3px_0_#000]">
                            <img src="${u.avatar}" class="w-8 h-8 rounded-full border-2 border-black object-cover">
                            <div class="overflow-hidden leading-tight">
                                <p class="text-[9px] font-black uppercase truncate">${u.nickname}</p>
                                <p class="text-[10px] text-red-500 font-bold">${u.streak}D 🔥</p>
                            </div>
                        </div>`;
                });

                const me = data.users.find(u => u.nickname.toUpperCase() === myNick);
                if(me) {
                    document.getElementById('user-streak').innerText = `${me.streak} DAYS 🔥`;
                    if(me.isBroken) {
                        document.getElementById('map-container').classList.add('broken-mode');
                        document.getElementById('alert-broken').classList.remove('hidden');
                    } else {
                        document.getElementById('map-container').classList.remove('broken-mode');
                        document.getElementById('alert-broken').classList.add('hidden');
                        movePawn(me.streak);
                        checkMilestones(me.streak);
                    }
                }
            } catch(e) { console.error("Lỗi đồng bộ!"); }
        }

        function movePawn(step) {
            if (step <= 0) return;
            const target = document.getElementById(`tile-${Math.min(step, 60)}`);
            const pawn = document.getElementById('player-pawn');
            if (!target || !pawn) return;
            const mapRect = document.getElementById('game-map').getBoundingClientRect();
            const rect = target.getBoundingClientRect();
            pawn.style.left = `${rect.left - mapRect.left + (rect.width/2) - 27}px`;
            pawn.style.top = `${rect.top - mapRect.top + (rect.height/2) - 27}px`;
            for(let i=1; i<=60; i++) {
                const t = document.getElementById(`tile-${i}`);
                if(t) t.classList.toggle('active', i <= step);
            }
        }

        function checkMilestones(streak) {
            const levels = { 10: "🥉", 20: "🥈", 30: "🥇", 40: "🎖️", 50: "🚀", 60: "👑" };
            Object.keys(levels).forEach(m => {
                if(streak >= m) {
                    document.getElementById(`b${m}`).classList.add('unlocked');
                    if(!milestonesAchieved.includes(m)) {
                        milestonesAchieved.push(m);
                        localStorage.setItem('achievements', JSON.stringify(milestonesAchieved));
                        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                    }
                }
            });
        }

        async function doAction(type) {
            const amt = document.getElementById('amt').value;
            const billFile = document.getElementById('bill').files[0];
            if(type === 'submit' && (!amt || !billFile)) return alert("Vui lòng nhập tiền và tải bill!");

            const btn = document.getElementById('btnSubmit');
            btn.disabled = true; btn.innerText = "ĐANG XỬ LÝ...";

            if (type === 'submit') {
                const reader = new FileReader();
                reader.readAsDataURL(billFile);
                reader.onload = function (event) {
                    sendToServer(event.target.result, amt, type, btn);
                };
            } else {
                sendToServer("", 0, type, btn);
            }
        }

        async function sendToServer(proof, amount, actionType, btn) {
            try {
                await fetch(APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ nickname: myNick, amount: amount, proof: proof, avatar: myAva, action: actionType })
                });
                alert("Thành công!");
                sync();
            } catch(e) { alert("Lỗi máy chủ!"); }
            btn.disabled = false; btn.innerText = "GỬI BÁO DANH 🔥";
        }
    </script>
</body>
</html>
