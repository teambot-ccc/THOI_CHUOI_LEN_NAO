<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captain Boy - Star Voyage & Sheep Field</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Quicksand:wght@700&display=swap');

        body {
            font-family: 'Quicksand', sans-serif;
            background: #bae6fd;
            background-image: repeating-conic-gradient(from 0deg, #bae6fd 0deg 15deg, #e0f2fe 15deg 30deg);
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px;
        }

        .comic-border { border: 6px solid #000; box-shadow: 10px 10px 0px #000; border-radius: 40px; background: white; }

        /* ĐỒNG CỪU ƯU TÚ */
        .sheep-field {
            background: #bbf7d0; /* Xanh lá đồng cỏ */
            border: 6px solid #166534;
            border-radius: 40px;
            padding: 20px;
            position: relative;
            background-image: radial-gradient(#86efac 2px, transparent 2px);
            background-size: 30px 30px;
            min-height: 400px;
        }

        .sheep-card {
            background: white;
            border: 3px solid #000;
            padding: 10px;
            border-radius: 20px;
            display: flex; flex-direction: column; align-items: center;
            width: 100px; transition: 0.3s;
            box-shadow: 4px 4px 0px #166534;
        }
        .sheep-card:hover { transform: scale(1.1) rotate(5deg); }

        /* BẢN ĐỒ GAME */
        #game-map {
            display: grid; grid-template-columns: repeat(10, 1fr); gap: 10px;
            width: 100%; max-width: 1000px; padding: 20px; position: relative;
        }
        .map-tile {
            aspect-ratio: 1; border: 3px solid #000; border-radius: 12px;
            background: white; display: flex; align-items: center; justify-content: center;
            font-family: 'Bangers'; font-size: 1rem; position: relative;
        }
        .map-tile.active { background: #fef08a; }
        .map-tile.gift-node { background: #fca5a5; border-color: #ef4444; }
        .map-tile.gift-node::after { content: '🎁'; position: absolute; top: -10px; right: -10px; }

        #player-pawn {
            position: absolute; width: 50px; height: 50px; z-index: 50;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(4px 4px 0px rgba(0,0,0,0.1));
        }

        .btn-comic {
            background: #ef4444; color: white; border: 4px solid #000;
            font-family: 'Bangers'; font-size: 1.5rem; padding: 10px 25px;
            box-shadow: 0 5px 0 #000; border-radius: 20px;
        }
    </style>
</head>
<body>

    <!-- UI CHÍNH -->
    <div class="max-w-7xl w-full space-y-10">
        
        <header class="text-center">
            <h1 class="text-6xl text-white italic" style="font-family: 'Bangers'; text-shadow: 5px 5px 0px #000;">STAR VOYAGE</h1>
            <p class="bg-yellow-400 border-4 border-black inline-block px-4 py-1 rounded-full font-black text-sm uppercase italic">Hành trình 60 ngày cùng Captain Boy</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- CỘT TRÁI: BẢN ĐỒ VÀ FORM -->
            <div class="lg:col-span-8 space-y-8">
                <div class="comic-border p-4 relative bg-white">
                    <h3 class="text-center font-black uppercase text-blue-600 mb-4 italic">Bản Đồ Hành Trình</h3>
                    <div id="game-map">
                        <img id="player-pawn" src="https://api.dicebear.com/7.x/adventurer/svg?seed=Felix" alt="pawn">
                        <!-- Tiles render by JS -->
                    </div>
                </div>

                <div class="comic-border p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <h3 class="text-xl font-black text-red-500 uppercase italic">Báo danh giữ lửa</h3>
                        <input type="text" id="nick" placeholder="Nickname..." class="w-full border-4 border-black p-3 rounded-xl font-bold outline-none focus:bg-blue-50">
                        <input type="file" id="fileInp" class="hidden">
                        <button onclick="document.getElementById('fileInp').click()" class="w-full border-2 border-dashed border-gray-400 p-2 rounded-xl text-xs font-bold text-gray-400">Tải ảnh minh chứng</button>
                    </div>
                    <div class="flex flex-col justify-end">
                        <button onclick="submitDay()" class="btn-comic w-full uppercase">Tiến Lên Ô Tiếp Theo 🔥</button>
                    </div>
                </div>
            </div>

            <!-- CỘT PHẢI: ĐỒNG CỪU ƯU TÚ -->
            <div class="lg:col-span-4 space-y-4">
                <div class="sheep-field shadow-xl overflow-hidden">
                    <h3 class="text-center font-black text-green-800 uppercase italic mb-6 text-xl">Đồng Cừu Ưu Tú 🐑</h3>
                    <!-- Các chú cừu sẽ hiện ở đây -->
                    <div id="sheep-container" class="flex flex-wrap justify-center gap-4">
                        <p class="text-green-700 italic text-xs">Đang lùa cừu ra đồng...</p>
                    </div>
                </div>
                
                <div class="comic-border p-4 bg-pink-50">
                    <h4 class="font-black text-xs text-pink-600 uppercase mb-2">Quà tặng sắp tới:</h4>
                    <p id="next-gift" class="text-sm font-bold italic">Đạt mốc 10 ngày để nhận Huy Hiệu!</p>
                </div>
            </div>

        </div>
    </div>

    <!-- MODAL NHẬN QUÀ -->
    <div id="gift-modal" class="fixed inset-0 bg-black/80 z-[1000] hidden flex items-center justify-center p-6 backdrop-blur-md">
        <div class="comic-border p-10 text-center max-w-sm bg-white">
            <h2 class="text-4xl text-red-500 font-black mb-4" style="font-family: 'Bangers'">BÙM! NHẬN QUÀ 🎁</h2>
            <p id="gift-desc" class="font-bold text-gray-600 mb-6 italic">Bạn đã mở khóa được một món quà bí mật!</p>
            <button onclick="closeGift()" class="btn-comic px-10">TUYỆT VỜI!</button>
        </div>
    </div>

    <script>
        const APP_URL = "DÁN_LINK_APP_SCRIPT_CỦA_BẠN_VÀO_ĐÂY";
        let myStreak = 0;
        const milestones = {
            10: "Huy hiệu Cừu Non rực rỡ!",
            20: "Voice chúc buổi sáng từ Captain Boy!",
            30: "Thư tay Digital độc quyền!",
            40: "Quyền tham gia VIP chat!",
            50: "Video tập luyện bí mật!",
            60: "Bộ quà hiện vật Photocard giới hạn!"
        };

        // 1. KHỞI TẠO MAP
        function initMap() {
            const map = document.getElementById('game-map');
            for (let i = 1; i <= 60; i++) {
                const tile = document.createElement('div');
                tile.id = `tile-${i}`;
                tile.className = "map-tile";
                if (milestones[i]) tile.classList.add('gift-node');
                tile.innerText = i;
                map.appendChild(tile);
            }
        }

        // 2. DI CHUYỂN
        function movePlayer(step) {
            if (step === 0) return;
            const targetTile = document.getElementById(`tile-${step}`);
            const pawn = document.getElementById('player-pawn');
            const rect = targetTile.getBoundingClientRect();
            const mapRect = document.getElementById('game-map').getBoundingClientRect();
            
            pawn.style.transform = `translate(${rect.left - mapRect.left + (rect.width/2) - 25}px, ${rect.top - mapRect.top + (rect.height/2) - 35}px)`;
            
            for(let i=1; i<=step; i++) document.getElementById(`tile-${i}`).classList.add('active');

            if (milestones[step]) {
                document.getElementById('gift-desc').innerText = milestones[step];
                document.getElementById('gift-modal').classList.remove('hidden');
                confetti({ particleCount: 200, spread: 80, origin: { y: 0.6 } });
            }
        }

        function closeGift() { document.getElementById('gift-modal').classList.add('hidden'); }

        // 3. ĐỒNG CỪU ƯU TÚ (RANKING)
        function renderSheep(users) {
            const container = document.getElementById('sheep-container');
            container.innerHTML = '';
            
            // Sắp xếp theo streak giảm dần
            const sorted = users.sort((a,b) => b.streak - a.streak).slice(0, 12);

            sorted.forEach(u => {
                const sheep = document.createElement('div');
                sheep.className = "sheep-card";
                // Dùng icon cừu dễ thương
                sheep.innerHTML = `
                    <img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=Sheep&backgroundColor=transparent" class="w-12 h-12">
                    <p class="text-[10px] font-black uppercase text-gray-700 truncate w-full text-center">${u.nickname}</p>
                    <span class="bg-blue-500 text-white text-[8px] px-2 py-0.5 rounded-full mt-1">${u.streak} 🔥</span>
                `;
                container.appendChild(sheep);
            });
        }

        // 4. SYNC DỮ LIỆU
        async function sync() {
            const nick = document.getElementById('nick').value;
            const res = await fetch(APP_URL);
            const data = await res.json();
            
            renderSheep(data);

            const me = data.find(u => u.nickname === nick);
            if(me && me.status === "Approved" && me.streak > myStreak) {
                myStreak = parseInt(me.streak);
                movePlayer(myStreak);
            }
        }

        async function submitDay() {
            const nick = document.getElementById('nick').value;
            const file = document.getElementById('fileInp').files[0];
            if(!nick || !file) return alert("Nhập Nickname và Ảnh bill nhé Thuyền viên!");
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async () => {
                await fetch(APP_URL, { method: 'POST', body: JSON.stringify({ action: "submit", nickname: nick, proof: reader.result, streak: myStreak }) });
                alert("🐑 Be beee! Minh chứng đã gửi, chờ Captain lùa cừu lên ô tiếp theo nhé!");
            };
        }

        initMap();
        setInterval(sync, 15000);
    </script>
</body>
</html>
