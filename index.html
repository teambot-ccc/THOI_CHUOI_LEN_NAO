<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THỔI CHUỖI LÊN NÀO - CAPTAIN BOY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Quicksand:wght@700&display=swap');
        body { font-family: 'Quicksand', sans-serif; background: #e0f2fe; min-height: 100vh; overflow-x: hidden; }
        .comic-border { border: 5px solid #000; box-shadow: 8px 8px 0px #000; border-radius: 30px; background: white; }
        .btn-comic { background: #ef4444; color: white; border: 3px solid #000; font-family: 'Bangers'; padding: 12px 20px; box-shadow: 0 5px 0 #000; border-radius: 20px; transition: 0.2s; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-comic:active { transform: translateY(4px); box-shadow: 0 1px 0 #000; }
        
        .broken-mode { filter: grayscale(1); pointer-events: none; opacity: 0.6; }
        .ava-box { border: 4px solid transparent; border-radius: 20px; cursor: pointer; transition: 0.3s; padding: 5px; background: #f8fafc; text-align: center; }
        .ava-box.selected { border-color: #3b82f6; background: #dbeafe; transform: scale(1.05); }

        #game-map { display: grid; grid-template-columns: repeat(auto-fill, minmax(55px, 1fr)); gap: 10px; padding: 20px; position: relative; }
        .map-tile { aspect-ratio: 1; border: 2px solid #000; border-radius: 12px; background: rgba(255,255,255,0.8); display: flex; align-items: center; justify-content: center; font-family: 'Bangers'; font-size: 1.2rem; }
        .map-tile.active { background: #fef08a; border-color: #f59e0b; color: #b45309; }
        .map-tile.milestone { background: #fee2e2; border-color: #ef4444; color: #ef4444; }
        
        #player-pawn { 
            position: absolute; width: 55px; height: 55px; z-index: 100; 
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 3px solid #000; border-radius: 50%; background: white; object-fit: cover;
        }

        /* CHUỖI NHÓM: Có thể kéo thả */
        .group-status { position: fixed; bottom: 20px; left: 20px; z-index: 1000; width: 220px; cursor: move; user-select: none; touch-action: none; }

        /* ĐỒNG CỪU ƯU TÚ: Nhỏ gọn 3 cột */
        .farm-bg { background-image: url('nenuutu.jpg'); background-size: cover; border: 6px solid #4d2c19; height: 500px; border-radius: 20px; position: relative; display: flex; flex-direction: column; overflow: hidden; }
        #farm-grid { overflow-y: auto; padding: 10px; flex-grow: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        
        .sheep-card { background: rgba(255, 255, 255, 0.9); border: 2px solid #000; border-radius: 12px; padding: 4px; display: flex; flex-direction: column; align-items: center; text-align: center; box-shadow: 2px 2px 0px #000; }
        .sheep-card img { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #000; object-fit: cover; background: white; }
        .sheep-card p.name { font-size: 8px; font-weight: 900; margin-top: 2px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .sheep-card p.streak { font-size: 9px; color: #ef4444; font-weight: 700; }

        .badge-item { width: 35px; height: 35px; border-radius: 50%; border: 2px dashed #999; display: flex; align-items: center; justify-content: center; filter: grayscale(1); font-size: 16px; background: #f1f5f9; }
        .badge-item.unlocked { border: 2px solid #000; background: #fff; filter: grayscale(0); box-shadow: 2px 2px 0 #000; transform: scale(1.1); }
        
        #congrats-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 3000; align-items: center; justify-content: center; padding: 20px; }
        .congrats-content { background: white; border: 6px solid #000; border-radius: 40px; padding: 40px; text-align: center; max-width: 400px; width: 100%; transform: scale(0.5); opacity: 0; }
    </style>
</head>
<body>

    <audio id="sfx-win" src="nhacnenmodau.mp3"></audio>
    <audio id="bgm" loop src="nhacnenmodau.mp3"></audio>

    <!-- WIDGET CHUỖI NHÓM -->
    <div id="group-widget" class="group-status hidden">
        <div class="comic-border p-4 bg-orange-400 border-black shadow-[4px_4px_0px_#000]">
            <p class="text-[10px] font-black uppercase text-white mb-1 drop-shadow-md text-center">Chuỗi Nhóm Hệ Cừu 🔥</p>
            <div id="group-streak-val" class="text-4xl font-black text-white italic text-center mb-2" style="font-family: 'Bangers'">0 DAYS</div>
            <div class="bg-white/30 p-2 rounded-xl border-2 border-black text-center">
                <p class="text-[8px] font-bold text-black mb-1 italic leading-tight">Đủ 30 cừu báo danh để giữ chuỗi nhóm!</p>
                <div class="w-full h-3 bg-gray-200 border border-black rounded-full overflow-hidden">
                    <div id="group-bar" class="h-full bg-green-500 transition-all duration-700" style="width: 0%"></div>
                </div>
                <p id="group-count-val" class="text-[10px] font-black text-black mt-1">0/30 Cừu</p>
            </div>
        </div>
    </div>

    <!-- POP-UP CHÚC MỪNG -->
    <div id="congrats-modal">
        <div class="congrats-content">
            <h2 class="text-5xl mb-4 text-yellow-500" style="font-family: 'Bangers'">TUYỆT VỜI!</h2>
            <div id="congrats-badge-icon" class="text-7xl mb-4">🥉</div>
            <p id="congrats-text" class="text-xl font-black uppercase mb-6 leading-tight"></p>
            <button onclick="closeCongrats()" class="btn-comic w-full text-2xl">TIẾP TỤC</button>
        </div>
    </div>

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="login-screen" class="fixed inset-0 z-[2000] bg-sky-500 flex items-center justify-center p-4">
        <div class="comic-border p-8 max-w-md w-full text-center space-y-6">
            <h1 class="text-4xl text-blue-700" style="font-family: 'Bangers'">THỔI CHUỖI LÊN NÀO</h1>
            <div class="grid grid-cols-3 gap-3">
                <div class="ava-box selected" onclick="pickAva(this, 'avatar1.jpg')"><img src="avatar1.jpg" class="w-full h-14 object-contain mx-auto"><p class="text-[9px] font-bold mt-1">Cừu Non</p></div>
                <div class="ava-box" onclick="pickAva(this, 'avatar2.jpg')"><img src="avatar2.jpg" class="w-full h-14 object-contain mx-auto"><p class="text-[9px] font-bold mt-1">Cừu Cute</p></div>
                <div class="ava-box flex flex-col items-center justify-center border-2 border-dashed border-gray-400" onclick="document.getElementById('uploadAva').click()">
                    <div id="pre-view" class="text-xs font-bold text-gray-500 py-1"><i class="fas fa-upload text-lg"></i><br>Ảnh riêng</div>
                    <input type="file" id="uploadAva" class="hidden" accept="image/*" onchange="handleUpload(this)">
                </div>
            </div>
            <input type="text" id="nick" class="w-full border-4 border-black p-3 rounded-xl text-center font-black uppercase text-lg" placeholder="TÊN CỪU THỔI CHUỖI...">
            <button onclick="startGame()" class="btn-comic w-full text-2xl uppercase">Bắt đầu</button>
        </div>
    </div>

    <!-- UI CHÍNH -->
    <div id="main-ui" class="hidden max-w-7xl mx-auto p-4 space-y-6">
        <header class="flex flex-wrap justify-between items-center bg-white border-4 border-black p-4 rounded-3xl">
            <div class="flex items-center gap-4">
                <img id="user-ava-header" src="" class="w-16 h-16 rounded-full border-4 border-black bg-white object-cover">
                <div>
                    <p id="user-nick-header" class="text-2xl font-black text-blue-600 uppercase italic"></p>
                    <div class="flex gap-1 mt-1" id="badge-container">
                        <div class="badge-item" id="b10">🥉</div><div class="badge-item" id="b20">🥈</div><div class="badge-item" id="b30">🥇</div>
                        <div class="badge-item" id="b40">🎖️</div><div class="badge-item" id="b50">🚀</div><div class="badge-item" id="b60">👑</div>
                    </div>
                </div>
            </div>
            <div class="text-right">
                <p id="user-streak" class="text-4xl font-black text-red-500 italic" style="font-family: 'Bangers'">0 DAYS 🔥</p>
                <p class="text-[10px] font-bold text-gray-400 uppercase italic">Chuỗi cá nhân</p>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 pb-24">
            <div class="lg:col-span-8 space-y-6">
                <div id="alert-broken" class="hidden comic-border bg-slate-700 text-white p-8 text-center space-y-4">
                    <h2 class="text-3xl font-black" style="font-family: 'Bangers'">BẠN ĐÃ BỊ ĐÓNG BĂNG!</h2>
                    <button onclick="doAction('restore')" class="btn-comic bg-blue-500 mx-auto">KHÔI PHỤC CHUỖI BÁO DANH NGAY 🆘</button>
                </div>
                <div id="map-container" class="comic-border bg-white relative overflow-hidden min-h-[350px]">
                    <div id="game-map"></div>
                </div>
                <div id="action-box" class="comic-border p-6 bg-yellow-50">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-end">
                        <div class="space-y-3">
                            <input type="number" id="amt" placeholder="SỐ TIỀN DNT..." class="w-full border-4 border-black p-3 rounded-xl font-black text-center">
                            <input type="file" id="bill" class="hidden" accept="image/*" onchange="updateFileName(this)">
                            <button type="button" onclick="document.getElementById('bill').click()" id="bill-btn" class="w-full border-2 border-dashed border-black p-3 rounded-xl font-black text-xs bg-white uppercase"><span id="bill-text">TẢI BILL MINH CHỨNG</span></button>
                        </div>
                        <button id="btnSubmit" onclick="doAction('submit')" class="btn-comic w-full h-[55px] text-xl uppercase italic">Gửi báo danh 🔥</button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-4">
                <div class="farm-bg comic-border relative">
                    <div class="p-4 bg-black/40 backdrop-blur-sm border-b-4 border-black sticky top-0 z-10">
                        <h3 class="text-center font-black text-white text-2xl uppercase italic drop-shadow-lg" style="font-family: 'Bangers'">Đồng Cừu Ưu Tú 🐑</h3>
                    </div>
                    <div id="farm-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const APP_URL = "https://script.google.com/macros/s/AKfycbwmeV8r7_QNgXu1_a29IhmCPNp_E8FHoBNmUWFAhCUPEiX2YStXDdR-mWfY-nGLWd37JQ/exec"; 
        let myNick = "", myAva = "avatar1.jpg";
        let milestonesAchieved = JSON.parse(localStorage.getItem('achievements') || '[]');

        function pickAva(el, url) {
            document.querySelectorAll('.ava-box').forEach(x => x.classList.remove('selected'));
            el.classList.add('selected'); myAva = url;
        }

        function handleUpload(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 150; canvas.width = MAX_WIDTH; canvas.height = img.height * (MAX_WIDTH / img.width);
                        const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        const compressed = canvas.toDataURL('image/jpeg', 0.8);
                        document.getElementById('pre-view').innerHTML = `<img src="${compressed}" class="w-full h-full object-cover rounded-lg">`;
                        myAva = compressed;
                        document.querySelectorAll('.ava-box').forEach(x => x.classList.remove('selected'));
                        input.closest('.ava-box').classList.add('selected');
                    };
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function updateFileName(input) {
            if (input.files[0]) document.getElementById('bill-text').innerText = "ĐÃ CHỌN: " + input.files[0].name;
        }

        function startGame() {
            myNick = document.getElementById('nick').value.trim().toUpperCase();
            if(!myNick) return alert("Vui lòng nhập tên Cừu Có Cánh!");
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-ui').classList.remove('hidden');
            document.getElementById('group-widget').classList.remove('hidden');
            document.getElementById('user-nick-header').innerText = myNick;
            document.getElementById('user-ava-header').src = myAva;
            initMap(); sync(); setInterval(sync, 20000);
            document.getElementById('bgm').play().catch(() => {});
        }

        function initMap() {
            const map = document.getElementById('game-map');
            const ms = [10, 20, 30, 40, 50, 60];
            map.innerHTML = `<img id="player-pawn" src="${myAva}" alt="pawn">`;
            for (let i = 1; i <= 60; i++) {
                const tile = document.createElement('div');
                tile.id = `tile-${i}`;
                tile.className = "map-tile " + (ms.includes(i) ? "milestone" : "");
                tile.innerText = i;
                map.appendChild(tile);
            }
        }

        async function sync() {
            try {
                const res = await fetch(APP_URL);
                const data = await res.json();
                
                document.getElementById('group-streak-val').innerText = `${data.groupStreak} DAYS`;
                document.getElementById('group-count-val').innerText = `${data.activeToday}/30 Cừu`;
                document.getElementById('group-bar').style.width = Math.min((data.activeToday / 30) * 100, 100) + '%';
                
                const grid = document.getElementById('farm-grid'); grid.innerHTML = '';
                data.users.sort((a,b) => b.streak - a.streak).forEach(u => {
                    grid.innerHTML += `<div class="sheep-card"><img src="${u.avatar}"><p class="name">${u.nickname}</p><p class="streak">${u.streak}D 🔥</p></div>`;
                });

                const me = data.users.find(u => u.nickname.toUpperCase() === myNick);
                if(me) {
                    document.getElementById('user-streak').innerText = `${me.streak} DAYS 🔥`;
                    myAva = me.avatar || myAva;
                    document.getElementById('user-ava-header').src = myAva;
                    document.getElementById('player-pawn').src = myAva;
                    if(me.isBroken) {
                        document.getElementById('map-container').classList.add('broken-mode');
                        document.getElementById('alert-broken').classList.remove('hidden');
                    } else {
                        document.getElementById('map-container').classList.remove('broken-mode');
                        document.getElementById('alert-broken').classList.add('hidden');
                        movePawn(me.streak); checkMilestones(me.streak);
                    }
                }
            } catch(e) { console.error("Lỗi đồng bộ!"); }
        }

        // KÉO THẢ CHUỖI NHÓM (DÙNG ĐƯỢC CẢ CHUỘT VÀ CẢM ỨNG)
        const dragElement = document.getElementById("group-widget");
        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;

        dragElement.onmousedown = dragMouseDown;
        dragElement.ontouchstart = dragMouseDown;

        function dragMouseDown(e) {
            e = e || window.event;
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            pos3 = clientX; pos4 = clientY;
            document.onmouseup = closeDragElement;
            document.ontouchend = closeDragElement;
            document.onmousemove = elementDrag;
            document.ontouchmove = elementDrag;
        }

        function elementDrag(e) {
            e = e || window.event;
            const clientX = e.clientX || (e.touches ? e.touches[0].clientX : null);
            const clientY = e.clientY || (e.touches ? e.touches[0].clientY : null);
            if (!clientX) return;
            pos1 = pos3 - clientX; pos2 = pos4 - clientY;
            pos3 = clientX; pos4 = clientY;
            dragElement.style.top = (dragElement.offsetTop - pos2) + "px";
            dragElement.style.left = (dragElement.offsetLeft - pos1) + "px";
            dragElement.style.bottom = "auto";
        }

        function closeDragElement() {
            document.onmouseup = null; document.onmousemove = null;
            document.ontouchend = null; document.ontouchmove = null;
        }

        function movePawn(step) {
            if (step <= 0) return;
            const target = document.getElementById(`tile-${Math.min(step, 60)}`), pawn = document.getElementById('player-pawn');
            if (!target || !pawn) return;
            const mapRect = document.getElementById('game-map').getBoundingClientRect(), rect = target.getBoundingClientRect();
            pawn.style.left = `${rect.left - mapRect.left + (rect.width/2) - 27}px`;
            pawn.style.top = `${rect.top - mapRect.top + (rect.height/2) - 27}px`;
            for(let i=1; i<=60; i++) {
                const t = document.getElementById(`tile-${i}`);
                if(t) t.classList.toggle('active', i <= step);
            }
        }

        function checkMilestones(streak) {
            const levels = { 10: "🥉", 20: "🥈", 30: "🥇", 40: "🎖️", 50: "🚀", 60: "👑" };
            Object.keys(levels).forEach(m => {
                if(streak >= m) {
                    const badge = document.getElementById(`b${m}`); if(badge) badge.classList.add('unlocked');
                    if(!milestonesAchieved.includes(m)) {
                        showCongrats(levels[m], `Chúc mừng thuyền viên ${myNick}! <br> Bạn đạt chuỗi ${m}!`);
                        milestonesAchieved.push(m); localStorage.setItem('achievements', JSON.stringify(milestonesAchieved));
                    }
                }
            });
        }

        function showCongrats(icon, text) {
            document.getElementById('congrats-badge-icon').innerText = icon;
            document.getElementById('congrats-text').innerHTML = text;
            document.getElementById('congrats-modal').style.display = 'flex';
            document.getElementById('sfx-win').play();
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            gsap.to(".congrats-content", { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.7)" });
        }
        function closeCongrats() { gsap.to(".congrats-content", { scale: 0.5, opacity: 0, duration: 0.3, onComplete: () => { document.getElementById('congrats-modal').style.display = 'none'; }}); }

        async function doAction(type) {
            const amt = document.getElementById('amt').value, billFile = document.getElementById('bill').files[0];
            if(type === 'submit' && (!amt || !billFile)) return alert("Vui lòng điền đủ tiền và bill!");
            const btn = document.getElementById('btnSubmit'); btn.disabled = true; btn.innerText = "XỬ LÝ...";
            if (type === 'submit') {
                const reader = new FileReader(); reader.readAsDataURL(billFile);
                reader.onload = function (event) {
                    const img = new Image(); img.src = event.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas'); const MAX_WIDTH = 500;
                        canvas.width = MAX_WIDTH; canvas.height = img.height * (MAX_WIDTH / img.width);
                        const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        sendToServer(canvas.toDataURL('image/jpeg', 0.7), amt, type, btn);
                    }
                };
            } else { sendToServer("", 0, type, btn); }
        }

        async function sendToServer(proof, amount, actionType, btn) {
            try {
                await fetch(APP_URL, { method: 'POST', body: JSON.stringify({ nickname: myNick, amount: amount, proof: proof, avatar: myAva, action: actionType }) });
                alert("Thành công!"); sync();
            } catch(e) { alert("Lỗi máy chủ!"); }
            btn.disabled = false; btn.innerText = "GỬI BÁO DANH 🔥";
        }
    </script>
</body>
</html>
